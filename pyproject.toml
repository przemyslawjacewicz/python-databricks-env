[project]
name = "python-databricks-env"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "delta-spark==4.0.0",
    "pyspark==4.0.3",
    "python-dotenv>=1.2.2"
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]